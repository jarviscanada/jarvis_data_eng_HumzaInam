apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: trading-psql-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trading-psql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trading-psql
  template:
    metadata:
      labels:
        app: trading-psql
    spec:
      containers:
        - name: trading-psql
          image: jason121301/trading-psql
          ports:
            - containerPort: 5432
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          env:
            - name: POSTGRES_DB
              value: "jrvstrading"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: trading-app
                  key: user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trading-app
                  key: password
          volumeMounts:
            - name: psql-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: psql-data
          persistentVolumeClaim:
            claimName: trading-psql-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: trading-psql-dev
spec:
  selector:
    app: trading-psql
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432